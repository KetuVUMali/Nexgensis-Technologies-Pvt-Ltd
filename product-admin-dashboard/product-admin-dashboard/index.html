<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Product Admin Dashboard built with React, Vite, Bootstrap and the DummyJSON API." />
    <title>Product Admin Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme BEFORE React loads, so the page does not flash white in dark mode. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.setAttribute('data-bs-theme', 'dark');
        }
      } catch (e) {
        /* localStorage blocked: the app falls back to the light theme */
      }
    </script>
    <style>
      html[data-bs-theme='dark'] { background: #0c1513; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
